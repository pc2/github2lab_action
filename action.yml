name: 'Github2lab'
author: 'Jakob Fritz'
description: 'Mirroring a repo to gitlab to use the gitlab-ci'
outputs:
  pipeline_id:
    description: 'ID of the GitLab pipeline started (trigger) or followed (get_status)'
    value: ${{ steps.status.outputs.pipeline_id || steps.trigger.outputs.pipeline_id }}
  web_url:
    description: 'URL of the GitLab pipeline'
    value: ${{ steps.status.outputs.web_url || steps.trigger.outputs.web_url }}
  sha:
    description: 'Commit the statuses and check runs are reported on (get_status) or the pipeline ran on (trigger)'
    value: ${{ steps.status.outputs.sha || steps.trigger.outputs.sha }}
  status:
    description: 'Status of the GitLab pipeline when get_status ended'
    value: ${{ steps.status.outputs.status }}
  finished:
    description: 'Whether the pipeline finished before MAX_WAIT_MINUTES ran out (get_status)'
    value: ${{ steps.status.outputs.finished }}
runs:
  using: "composite"
  steps:
    - run: |
        echo "Mode is unknown. It must be 'mirror', 'trigger', 'get_status', 'get_artifact', or 'all'. Not '$MODE'"
        exit 1
      shell: bash
      if:  (env.MODE != 'mirror') && (env.MODE != 'trigger') && (env.MODE != 'get_status') && (env.MODE != 'both') && (env.MODE != 'all') && (env.MODE != 'get_artifact')
    - run: echo "${{ github.action_path }}" >> $GITHUB_PATH
      shell: bash
    - run: mirror.sh
      env:
        PR_NUMBER: ${{ github.event.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      if: (env.MODE == 'mirror') || (env.MODE == 'both') || (env.MODE == 'all')
    - run: trigger.sh
      id: trigger
      env:
        PR_NUMBER: ${{ github.event.number }}
      shell: bash
      if: env.MODE == 'trigger'
    - run: get_ci_state.sh
      id: status
      env:
        PR_NUMBER: ${{ github.event.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      if: (env.MODE == 'get_status') || (env.MODE == 'both') || (env.MODE == 'all') 
    - run: get_artifact.py
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      if: (env.MODE == 'get_artifact') || (env.MODE == 'both') || (env.MODE == 'all')
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Use version 7.0.2.
      env:
        GITLAB_TOKEN: ''
        GITLAB_TRIGGER_TOKEN: ''
        GITHUB_TOKEN: ''
      with:
        path: ./artifacts/
      if: ((env.MODE == 'get_artifact') || (env.MODE == 'both') || (env.MODE == 'all')) && (env.UPLOAD_ARTIFACTS != 'false')
